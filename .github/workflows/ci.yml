name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Built plugin files match their sources
        run: >-
          git diff --exit-code --
          views/claude/hooks/register.js
          views/claude/dist views/claude/ui
          views/cursor/dist views/cursor/ui
          views/codex/dist views/codex/ui
